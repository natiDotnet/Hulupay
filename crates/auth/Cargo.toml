[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
# Domain dependencies
uuid = { version = "1.21.0", features = ["v7", "serde"] }
time = "0.3.47"
hulu_core = { package = "core", path = "../core" }
# Application layer dependencies
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.6.0-rc.7"
password-hash = "0.6.0-rc.12"

# Infrastructure dependencies
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
toasty = { workspace = true }
jiff = { workspace = true }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# API documentation
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

# HTTP framework (for API layer)
axum = { version = "0.8.8" }

strum = "0.28.0"
strum_macros = "0.28.0"
tracing = "0.1.44"

# Email (verification + password reset)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
sha2 = "0.10"

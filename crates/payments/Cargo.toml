[package]
name = "payments"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
merchant = { path = "../merchant" }
# Domain dependencies
uuid = { version = "1.21.0", features = ["v4", "serde"] }
time = { version = "0.3.47", features = ["serde", "formatting", "parsing"] }
chrono = { version = "0.4.43", features = ["serde"] }
# Application layer dependencies
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { workspace = true }
# Infrastructure dependencies
reqwest = { version = "0.13.2", features = ["json"] }
rust_decimal_macros = "1.40.0"
# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"
phonenumber = "0.3.9"

# API documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "decimal", "jiff_0_2", "debug"] }
jiff = { version = "0.2.35", features = ["serde"] }
utoipa-axum = { workspace = true }

# HTTP framework (for API layer)
axum = { version = "0.8.8" }

# Auth dependency
auth = { path = "../auth" }
hulu_core = { package = "core", path = "../core" }
arif = { package = "arifpay", path = "../arifpay" }
clap = { version = "4.6.0", features = ["derive"] }

strum = "0.28.0"
strum_macros = "0.28.0"
axum-macros = "0.5.1"
rust_decimal = { version = "1.42.0", features = ["serde"] }

toasty = { workspace = true }
# cache
deadpool-redis = "0.23.0"
redis = { version = "1.2.1", features = ["tokio-comp"] }
tracing = "0.1.44"
# PayBridge webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
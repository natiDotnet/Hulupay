[package]
name = "payments"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
merchant = { path = "../merchant" }
# Domain dependencies
uuid = { version = "1.21.0", features = ["v4", "serde"] }
time = { version = "0.3.47", features = ["serde", "formatting", "parsing"] }
chrono = { version = "0.4.43", features = ["serde"] }

# Application layer dependencies
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Infrastructure dependencies
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "macros", "uuid", "time", "chrono"] }
reqwest = { version = "0.13.2", features = ["json"] }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# API documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "decimal"] }
utoipa-axum = { version = "0.2.0" }

# HTTP framework (for API layer)
axum = { version = "0.8.8" }

# Auth dependency
auth = { path = "../auth" }
clap = { version = "4.6.0", features = ["derive"] }

strum = "0.28.0"
strum_macros = "0.28.0"
axum-debug-macros = "0.1.0"
rust_decimal = { version = "1.42.0", features = ["serde"] }

sea-orm = { version = "2.0.0-rc.38" }
# cache
deadpool-redis = "0.23.0"
redis = { version = "1.2.1", features = ["tokio-comp"] }
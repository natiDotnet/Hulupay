[package]
name = "arifpay"
version = "0.1.0"
edition = "2024"

[dependencies]

# API documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "decimal", "chrono", "debug"] }
utoipa-axum = { version = "0.2.0", features = ["debug"] }
axum-macros = "0.5.1"
tracing = "0.1.44"

# HTTP framework (for API layer)
axum = { version = "0.8.8" }

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.43", features = ["serde"] }
rust_decimal = { version = "1.42.0", features = ["serde", "serde-with-str", ] }
strum = "0.28.0"
strum_macros = "0.28.0"
reqwest = { version = "0.13.2", features = ["json"] }
#payments = { path = "../payments" }
#auth = { path = "../auth" }
hulu_core = { package = "core", path = "../core" }
sea-orm = { version = "2.0.0-rc.38" }


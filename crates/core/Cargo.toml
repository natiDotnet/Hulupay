[package]
name = "core"
version = "0.1.0"
edition = "2024"

[lib]
# The crate is named `core`, which shadows the built-in `core` module when
# rustdoc compiles the doctest harness — derive-generated `core::…` paths
# then fail to resolve. There are no doc examples, so skip doctests.
doctest = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
rust_decimal = { version = "1.42.0", features = ["serde", "serde-with-str", ] }
strum = "0.28.0"
strum_macros = "0.28.0"
#chrono = { version = "0.4.43", features = ["serde"] }
jiff = { workspace = true }
async-trait = "0.1.89"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v7", "serde"] }
regex = "1.12.4"
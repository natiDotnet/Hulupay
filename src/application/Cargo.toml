[package]
name = "application"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
anyhow = "1.0.102"
uuid = { version = "1.21.0", features = ["v4"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
chrono = "0.4.43"
aes-gcm = "0.11.0-rc.3"
base64 = "0.22.1"
rand = "0.10.0"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6.0-rc.7"
password-hash = "0.6.0-rc.12"
rand_core = "0.10.0"
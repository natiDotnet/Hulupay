services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: hulupay
      POSTGRES_PASSWORD: hulupay
      POSTGRES_DB: hulupay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hulupay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hulupay:hulupay@postgres:5432/hulupay
      JWT_SECRET: change-me-in-production
      RUST_LOG: info
    ports:
      - "5000:5000"

volumes:
  pgdata:

[package]
name = "Rust"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/*",
]

resolver = "2"

[workspace.dependencies]
toasty = { version = "0.9.0", features = ["postgresql", "jiff", "rust_decimal", "serde"] }
toasty-cli = "0.9.0"
tokio = { version = "1.49.0", features = ["full"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "decimal", "jiff_0_2", "debug"] }
jiff = { version = "0.2.35", features = ["serde"] }
utoipa-axum = { version = "0.2.0" }


[dependencies]
# Feature crates
auth = { path = "crates/auth" }
merchant = { path = "crates/merchant" }
payments = { path = "crates/payments" }
arifpay = { path = "crates/arifpay" }
hulu_core = { package = "core", path = "crates/core" }
tokio.workspace = true
axum = { version = "0.8.8" }
anyhow = "1.0.102"
dotenvy = "0.15.7"
#utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.44"
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
toasty = { workspace = true }
toasty-cli.workspace = true

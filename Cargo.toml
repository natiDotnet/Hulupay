[package]
name = "Rust"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "src/domain",
    "src/application",
    "src/infrastructure"
]

resolver = "2"
[dependencies]
infrastructure = { path = "src/infrastructure" }
application = { path = "src/application" }
domain = { path = "src/domain" }
tokio = { version = "1.49.0", features = ["full"]}
axum = { version = "0.8.8"}
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "macros"] }
uuid = { version = "1.21.0", features = ["v4"] }
anyhow = "1.0.102"
dotenvy = "0.15.7"
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
utoipa-axum = { version = "0.2.0" }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
async-trait = "0.1.89"
jsonwebtoken = "10.3.0"
headers = "0.4.1"
axum-extra = { version = "0.12.5", features = ["typed-header"] }
